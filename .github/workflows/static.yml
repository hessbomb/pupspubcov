# Deploy static content to GitHub Pages, injecting the Street View key at build time
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inject the Street View key from the GitHub secret into index.html.
      # The secret is read into an env var (never echoed), so it stays masked in logs.
      # Fails loudly if the secret is empty or the placeholder is missing.
      - name: Inject Street View API key
        env:
          GSV_KEY: ${{ secrets.GOOGLE_API }}
        run: |
          if [ -z "$GSV_KEY" ]; then
            echo "::error::GOOGLE_API secret is empty or not visible to this job/environment."
            exit 1
          fi
          if ! grep -q "__GSV_KEY__" index.html; then
            echo "::error::Placeholder __GSV_KEY__ not found in index.html. Nothing to inject."
            exit 1
          fi
          python3 - <<'PY'
          import os
          key = os.environ["GSV_KEY"]
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()
          n = html.count("__GSV_KEY__")
          html = html.replace("__GSV_KEY__", key)
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print(f"Injected Street View key into index.html ({n} placeholder(s) replaced)")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (now with the key injected into index.html)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
